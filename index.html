
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字小助手</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .description {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #d8dce5;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #3978f6;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      color: #666;
      margin: 12px 0 20px;
    }

    .buttons {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    #copyBtn {
      background: #3978f6;
      color: white;
    }

    #clearBtn {
      background: #edf0f5;
      color: #333;
    }

    button:hover {
      opacity: 0.85;
    }

    .tip {
  color: #888;
  font-size: 13px;
  margin: 8px 0;
}
  </style>
</head>

<body>
  <div class="container">
    <h1>文字小助手</h1>
    <p class="description">简单记录，实时统计</p>

    <textarea
      id="textInput"
      maxlength="100"
      placeholder="在这里输入你的文字……"
    ></textarea>

    <p class="tip">注：不计标点符号，一个英文单词算一个字符。</p>

    <div class="stats">
      <span>字符数：<span id="count">0</span></span>
      <span>剩余：<span id="remaining">100</span></span>
    </div>

<div class="buttons">
  <button id="copyBtn">复制文字</button>
  <button id="clearBtn">清空文字</button>
</div>

<div class="buttons" style="margin-top: 12px;">
  <button id="symbolBtn">开启符号计数：关闭</button>
</div>

  <script>

const input = document.getElementById("textInput");
const count = document.getElementById("count");
const remaining = document.getElementById("remaining");
const clearBtn = document.getElementById("clearBtn");
const copyBtn = document.getElementById("copyBtn");
const symbolBtn = document.getElementById("symbolBtn");

// 默认关闭符号计数
let countSymbols = false;

// 英文词典
const dictionary = new Set();
let dictionaryReady = false;

// 加载外部英文词典
fetch("https://cdn.jsdelivr.net/gh/dwyl/english-words@master/words_alpha.txt")
  .then(response => {
    if (!response.ok) {
      throw new Error("词典加载失败");
    }
    return response.text();
  })
  .then(data => {
    data.split(/\r?\n/).forEach(word => {
      dictionary.add(word.trim().toLowerCase());
    });

    dictionaryReady = true;
    updateCount();
    console.log("英文词典加载成功");
  })
  .catch(error => {
    console.error("英文词典加载失败：", error);
  });

// 统计文字
function countUnits(text) {
  const matches = text.match(
    /[\p{Script=Han}]|[A-Za-z]+(?:['’][A-Za-z]+)*|[^\s\p{Script=Han}A-Za-z\d]/gu
  );

  if (!matches) return 0;

  let total = 0;

  for (const item of matches) {
    // 每个汉字计数 1
    if (/^[\p{Script=Han}]$/u.test(item)) {
      total++;
    }
    // 符号只有在开启模式后才计数
    else if (/^[^\s\p{Script=Han}A-Za-z\d]$/u.test(item)) {
      if (countSymbols) total++;
    }
    // 词典中的英文单词计数 1
    else if (
      dictionaryReady &&
      dictionary.has(item.toLowerCase())
    ) {
      total++;
    }
    // 不在词典中的英文串按字母逐个计数
    else {
      total += (item.match(/[A-Za-z]/g) || []).length;
    }
  }

  return total;
}

// 更新字符数和剩余数量
function updateCount() {
  const total = countUnits(input.value);
  count.textContent = total;
  remaining.textContent = 100 - total;
}

// 输入时自动统计
input.addEventListener("input", updateCount);

// 清空按钮
clearBtn.addEventListener("click", function () {
  input.value = "";
  updateCount();
});

// 复制按钮
copyBtn.addEventListener("click", async function () {
  if (input.value === "") {
    alert("请先输入文字！");
    return;
  }

  try {
    await navigator.clipboard.writeText(input.value);
    alert("复制成功！");
  } catch (error) {
    alert("复制失败，请检查浏览器权限。");
  }
});

// 符号计数切换按钮
symbolBtn.addEventListener("click", function () {
  countSymbols = !countSymbols;

  symbolBtn.textContent = countSymbols
    ? "开启符号计数：开启"
    : "开启符号计数：关闭";

  updateCount();
});

// 页面打开时先统计一次
updateCount();

  </script>
</body>
</html>
