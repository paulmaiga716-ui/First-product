
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字小助手</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .description {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #d8dce5;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #3978f6;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      color: #666;
      margin: 12px 0 20px;
    }

    .buttons {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    #copyBtn {
      background: #3978f6;
      color: white;
    }

    #clearBtn {
      background: #edf0f5;
      color: #333;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>文字小助手</h1>
    <p class="description">简单记录，实时统计</p>

    <textarea
      id="textInput"
      maxlength="100"
      placeholder="在这里输入你的文字……"
    ></textarea>

    <div class="stats">
      <span>字符数：<span id="count">0</span></span>
      <span>剩余：<span id="remaining">100</span></span>
    </div>

    <div class="buttons">
      <button id="copyBtn">复制文字</button>
      <button id="clearBtn">清空文字</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("textInput");
    const count = document.getElementById("count");
    const remaining = document.getElementById("remaining");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");

    input.addEventListener("input", function () {
      count.textContent = input.value.length;
      remaining.textContent = 100 - input.value.length;
    });

    clearBtn.addEventListener("click", function () {
      input.value = "";
      count.textContent = 0;
      remaining.textContent = 100;
    });

    copyBtn.addEventListener("click", async function () {
      if (input.value === "") {
        alert("请先输入文字！");
        return;
      }

      try {
        await navigator.clipboard.writeText(input.value);
        alert("复制成功！");
      } catch (error) {
        alert("复制失败，请检查浏览器权限。");
      }
    });
  </script>
</body>
</html>
